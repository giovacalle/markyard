name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm check:web
      - run: pnpm test:web
      - run: pnpm build
      - run: pnpm check:bff
      - run: pnpm test:bff
